name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: las
          POSTGRES_PASSWORD: las
          POSTGRES_DB: las
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U las"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the Postgres resume test (tests/pipeline/test_pipeline_postgres.py) runs against it
      LAS_TEST_POSTGRES_URL: postgresql://las:las@localhost:5432/las?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras --group dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Prompt provenance
        run: uv run python tools/derive_prompts.py --check
      - name: Generated documentation
        run: uv run python tools/list_steps.py --check
      - name: Vendored files
        run: uv run python tools/vendor_upstream.py --check
      - name: Tests
        run: uv run pytest -m "not integration"
      - name: Public check
        run: uv run python tools/check_public.py
