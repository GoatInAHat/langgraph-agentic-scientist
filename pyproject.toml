[project]
name = "langgraph-agentic-scientist"
version = "0.1.0"
readme = "README.md"
description = "A LangGraph port of Sakana AI's Agentic Scientist (AI-Scientist-v3): task drafting, investigation, ablations, sealed final evaluation, post-hoc analysis, paper writing and review as reusable LangGraph graphs."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "the langgraph-agentic-scientist contributors" }]
keywords = ["langgraph", "langchain", "agents", "automated-research", "ai-scientist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.24,<2",
    "langchain-core>=1.8.5,<2",
    "langchain>=1.5.2,<2",
    "deepagents>=0.7.41,<0.8",
    "pydantic>=2.14,<3",
    "httpx>=0.27,<1",
    "pypdf>=5",
    "pyyaml>=6",
]

[project.optional-dependencies]
review = ["pymupdf4llm>=0.0.17", "pymupdf>=1.24", "pypdf>=5"]
retrieval = ["scholarly>=1.7"]
postgres = ["langgraph-checkpoint-postgres>=3.2.1,<4", "psycopg[binary,pool]>=3.2,<4"]
openai = ["langchain-openai>=1.8.5,<2"]

[project.urls]
Repository = "https://github.com/GoatInAHat/langgraph-agentic-scientist"
Upstream = "https://github.com/SakanaAI/AI-Scientist-v3"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "langgraph-checkpoint-sqlite>=3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_agentic_scientist"]

[tool.hatch.build.targets.sdist]
include = [
    "src/langgraph_agentic_scientist",
    "third_party",
    "tools",
    "tests",
    "examples",
    "docs",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: runs real evaluators or tools on the host (deselected by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "third_party",
    "examples/circpack",
    "examples/circpack_task_drafting",
    "src/langgraph_agentic_scientist/skills",
    "tests/fixtures",
    "*.md",  # prompt texts are upstream bytes; never reformat them
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001",  # upstream prompt texts contain typographic characters
    "RUF002",
    "RUF003",
    "ASYNC109",  # protocol methods take the evaluation or command timeout as a parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"tests/core/test_serde.py" = ["E501"]  # the strict-msgpack script is a string
"tests/core/test_workspace_contract_star.py" = ["F403"]  # the documented use imports the contract whole

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["src/langgraph_agentic_scientist/skills/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["deepagents.*", "langchain.*"]
follow_untyped_imports = true
