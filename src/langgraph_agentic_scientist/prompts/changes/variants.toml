# Declared changes of the variants package (ablations and baselines): the six variant prompts,
# the two inline prompts of execute.py, and the texts that upstream's variants pipeline builds in
# code (variant task.md files, cross-task task.md files, rubric descriptions, README pieces).
# Paths of `upstream` are relative to third_party/ai-scientist-v3/, paths of `target` to
# src/langgraph_agentic_scientist/. Kinds A1-A8 are the systematic adaptations described in
# docs/ADAPTATIONS.md. variant_agent.md is not built: no upstream code loads it.
#
# A text assembled in code is carried one string expression at a time (tools/derive_prompts.py
# extracts exactly one string expression per entry); variants/materialize.py, cross_task.py and
# readme.py compose the pieces in upstream's order and with upstream's conditions.

# --- the live prompts (src/prompts/) ------------------------------------------------------------

[[file]]
upstream = "src/prompts/variant_retrofit.md"
target = "prompts/variants/variant_retrofit.md"
reason = "Prompt of the retrofit agent (R16); no skills. Verbatim."

[[file]]
upstream = "src/prompts/variant_generate.md"
target = "prompts/variants/variant_generate.md"
reason = "Prompt of the variant generator (R17), a structured role; no skills."

[[file.change]]
kind = "A3"
old = "Write your output to `variant_bundle.json` in the current working directory."
new = "Return your output as your structured response; the harness writes it to `./variant_bundle.json`."
count = 1
reason = "The generator answers through structured output, and the host writes the file upstream's pipeline reads. The schema below the sentence stays: it carries the meaning of each field."

[[file]]
upstream = "src/prompts/variant_select.md"
target = "prompts/variants/variant_select.md"
reason = "Prompt of the variant reviewer (R18), a structured role; no skills."

[[file.change]]
kind = "A3"
old = "Evaluate each candidate and write `variant_selection.json` in the current working directory with your decisions."
new = "Evaluate each candidate and return your decisions as your structured response; the harness writes the final selection to `./variant_selection.json`."
count = 1
reason = "The reviewer answers through structured output; the host applies the hard caps and writes the file. The schema stays."

[[file]]
upstream = "src/prompts/variant_readme.md"
target = "prompts/variants/variant_readme.md"
reason = "Prompt of the README summariser (R22), a structured role; no skills."

[[file.change]]
kind = "A3"
old = "Write a JSON file `variant_summaries.json` to your working directory with this exact structure:"
new = "Return your answer as your structured response; the harness writes it to `./variant_summaries.json`. It has this exact structure:"
count = 1
reason = "The summariser answers through structured output. The structure and the rules stay."

