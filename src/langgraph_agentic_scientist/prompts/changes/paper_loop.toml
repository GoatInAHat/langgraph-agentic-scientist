# --- evidence audit (R33) --------------------------------------------------------------------

[[file]]
upstream = "src/prompts/paper_review/evidence_audit.md"
target = "prompts/paper/evidence_audit.md"
reason = "Evidence auditor (R33): read-only, on a disposable copy of the paper, answers with the structured AuditPayload."

[[file.change]]
kind = "A5"
old = '''
# Output contract
Output raw text only. Do not write files. Do not include markdown fences.
Use this exact line-oriented contract so downstream regex parsing is stable:

```text
AUDIT_VERDICT: PASS|FAIL
AUDIT_SUMMARY: one-line overall assessment
AUDIT_FINDING_COUNT: N
AUDIT_FINDING: id=<stable-id> || section=<paper section> || claim=<claim text or short quote> || issue=<what is inconsistent> || evidence=<artifact-backed evidence> || fix=<specific manuscript-only fix>
```

Rules:
- `AUDIT_VERDICT` must be `PASS` or `FAIL`.
- `AUDIT_SUMMARY` must be one line.
- `AUDIT_FINDING_COUNT` must be an integer.
- Emit exactly `N` `AUDIT_FINDING:` lines.
- If the verdict is `PASS`, `N` must be `0` and you must emit no `AUDIT_FINDING:` lines.
- If the verdict is `FAIL`, `N` must be at least `1`.
- Keep each `AUDIT_FINDING:` on a single line.
- Use the literal separator ` || ` between fields.
- Do not include the separator string ` || ` inside field values.
- `fix` must be a manuscript-only repair request.

Good pass example:
```text
AUDIT_VERDICT: PASS
AUDIT_SUMMARY: The manuscript claims are consistent with claims_grounding.json and the current scientific-evidence trail.
AUDIT_FINDING_COUNT: 0
```

Good fail example:
```text
AUDIT_VERDICT: FAIL
AUDIT_SUMMARY: One visible results claim overstates what the grounded evidence currently supports.
AUDIT_FINDING_COUNT: 1
AUDIT_FINDING: id=results-overclaim-1 || section=Results || claim=The paper says the method consistently outperforms all baselines across tasks. || issue=claims_grounding.json only supports one benchmark-specific improvement and does not justify the across-tasks wording. || evidence=paper.tex Results paragraph 2; claims_grounding.json claim[3]; paper_data.json grounding_sources for the cited result ids. || fix=Narrow the sentence to the supported benchmark or add an explicit limitation.
```'''
new = '''
# Output contract
Do not write files. Return the audit as your structured response; the harness writes it to `./paper_evidence_audit.json` and derives the audit feedback from it.
The structured response has these fields:

- `verdict`: `pass` or `fail`.
- `summary`: one-line overall assessment.
- `findings`: the list of findings. Each finding has the fields `id` (a stable id), `section` (the paper section), `claim` (the claim text or a short quote), `issue` (what is inconsistent), `evidence` (artifact-backed evidence) and `fix` (a specific manuscript-only fix).

Rules:
- `verdict` must be `pass` or `fail`.
- `summary` must be one line.
- If the verdict is `pass`, `findings` must be empty.
- If the verdict is `fail`, `findings` must contain at least one finding.
- Every field of a finding must be non-empty.
- `fix` must be a manuscript-only repair request.

Good pass example:
```json
{"verdict": "pass", "summary": "The manuscript claims are consistent with claims_grounding.json and the current scientific-evidence trail.", "findings": []}
```

Good fail example:
```json
{"verdict": "fail", "summary": "One visible results claim overstates what the grounded evidence currently supports.", "findings": [{"id": "results-overclaim-1", "section": "Results", "claim": "The paper says the method consistently outperforms all baselines across tasks.", "issue": "claims_grounding.json only supports one benchmark-specific improvement and does not justify the across-tasks wording.", "evidence": "paper.tex Results paragraph 2; claims_grounding.json claim[3]; paper_data.json grounding_sources for the cited result ids.", "fix": "Narrow the sentence to the supported benchmark or add an explicit limitation."}]}
```'''
count = 1
reason = "The line protocol existed to parse an answer out of an agent log; the answer is the structured AuditPayload. Fields, rules and both examples are kept in the same words; the count line and the separator rules have no object any more."

