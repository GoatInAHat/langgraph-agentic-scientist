# Declared changes of the task-scaffold drafting package: the five role prompts, the draft-task
# skill, and the workflow texts that upstream keeps in code. Paths of `upstream` are relative to
# third_party/ai-scientist-v3/, paths of `target` to src/langgraph_agentic_scientist/.
# Kinds A1-A8 are the systematic adaptations described in docs/ADAPTATIONS.md.
#
# Texts of upstream's shell code (src/scripts/task.sh, src/scripts/lib/task_gate.sh) and of the
# Python heredocs inside it, like the texts of its Python modules, are extracted by
# tools/derive_prompts.py into third_party/ai-scientist-v3/extracted/drafting_scaffold/.

