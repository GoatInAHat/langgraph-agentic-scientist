# Declared changes of the post-hoc package: the four post-hoc prompts and the texts of the generated
# analysis task.md that live in upstream code (src/posthoc_pipeline/materialize.py). Paths of
# `upstream` are relative to third_party/ai-scientist-v3/, paths of `target` to
# src/langgraph_agentic_scientist/. Kinds A1-A8 are the systematic adaptations described in
# docs/ADAPTATIONS.md.

# --- the four prompts --------------------------------------------------------------------------

[[file]]
upstream = "src/prompts/posthoc_bootstrap.md"
target = "prompts/posthoc/posthoc_bootstrap.md"
reason = "Role R23 (bootstrap agent), verbatim. The harness fills {{TASK_MD}}, {{EVALUATOR_SOURCE}}, {{PROGRAM_SOURCE}} and {{RESULTS_JSON}}."

[[file]]
upstream = "src/prompts/posthoc_generate.md"
target = "prompts/posthoc/posthoc_generate.md"
reason = "Role R24 (analysis generator), a structured role: the answer is returned as the structured response and the harness writes posthoc_bundle.json."

[[file.change]]
kind = "A3"
old = "Write `posthoc_bundle.json` with:"
new = "Return your structured response (the harness writes it to `./posthoc_bundle.json`) with:"
count = 1
reason = "The agent no longer writes the JSON file itself; the field list that follows is unchanged because it carries the meaning of each field."

[[file]]
upstream = "src/prompts/posthoc_select.md"
target = "prompts/posthoc/posthoc_select.md"
reason = "Role R25 (analysis selector), a structured role: the decisions are returned as the structured response and the harness writes posthoc_selection.json."

[[file.change]]
kind = "A3"
old = "Review the proposed post-hoc analyses and write `posthoc_selection.json`."
new = "Review the proposed post-hoc analyses and return your decisions as your structured response (the harness writes them to `./posthoc_selection.json`)."
count = 1
reason = "The agent no longer writes the JSON file itself; the schema block that follows is unchanged."

[[file]]
upstream = "src/prompts/posthoc_agent.md"
target = "prompts/posthoc/posthoc_agent.md"
reason = "Role R26 (analysis executor), verbatim. The harness fills {{ANALYSIS_SPEC}}, {{RUBRIC_CONTRACT}}, {{ATTEMPT_NUMBER}} and {{ERROR_CONTEXT}}."

